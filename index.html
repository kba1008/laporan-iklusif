<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Laporan AI Auto-Sync Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #1d4ed8; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .scroll-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="p-4 md:p-10" onload="fetchHistory()">

    <div class="max-w-5xl mx-auto space-y-8">
        <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-200">
            <div class="bg-blue-700 p-8 text-white">
                <h1 class="text-2xl font-medium tracking-tight uppercase">Sistem Laporan AI Profesional</h1>
                <p class="text-blue-100 text-sm mt-1">Format Esei Panjang (300-350 Patah Perkataan) & Auto-Sync Google Sheet</p>
            </div>

            <div class="p-8 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="col-span-full">
                        <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">Pilih Mod Laporan Khusus</label>
                        <select id="reportType" class="w-full p-4 border rounded-2xl bg-gray-50 outline-none focus:ring-2 focus:ring-blue-600 transition-all">
                            <option value="LAPORAN INKLUSIF">📘 Laporan Program Pendidikan Inklusif (PPI)</option>
                            <option value="LAPORAN KOKURIKULUM">🏆 Laporan Aktiviti Kokurikulum & Sukan</option>
                            <option value="LAPORAN DOKUMENTASI">📂 Laporan Dokumentasi & Acara Sekolah</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1 ml-1">Nama Program</label>
                        <input type="text" id="subject" class="w-full p-4 border rounded-xl bg-gray-50 outline-none" placeholder="Contoh: Perkhemahan Perdana">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1 ml-1">Nama Guru Pelapor</label>
                        <input type="text" id="teacher" class="p-4 w-full border rounded-xl bg-gray-50 outline-none" placeholder="Nama penuh anda">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1 ml-1">Bilangan Murid</label>
                        <input type="number" id="studentCount" class="p-4 w-full border rounded-xl bg-gray-50 outline-none" placeholder="0">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1 ml-1">Tarikh Aktiviti</label>
                        <input type="date" id="reportDate" class="p-4 w-full border rounded-xl bg-gray-50 outline-none">
                    </div>
                </div>

                <div class="space-y-3">
                    <label class="block text-xs font-semibold text-gray-500 uppercase">Lampiran Gambar (Min 1, Max 10)</label>
                    <input type="file" id="fileInput" accept="image/*" multiple onchange="handleImages(this)" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    <div id="previewArea" class="flex gap-4 overflow-x-auto py-2 scroll-hide"></div>
                </div>

                <div class="space-y-2">
                    <label class="block text-xs font-semibold text-gray-500 uppercase">Nota Ringkas Aktiviti</label>
                    <textarea id="notes" rows="4" class="w-full p-4 border rounded-2xl bg-gray-50 outline-none focus:ring-2 focus:ring-blue-400" placeholder="Ceritakan perjalanan aktiviti secara ringkas..."></textarea>
                </div>

                <button onclick="generateAndSave()" id="btnAction" class="w-full bg-blue-700 text-white py-5 rounded-2xl font-semibold shadow-lg hover:bg-blue-800 active:scale-95 transition-all text-lg">🚀 JANA LAPORAN SEKARANG</button>
                
                <div id="loading" class="hidden flex flex-col items-center py-4">
                    <div class="loader"></div>
                    <p id="status" class="text-blue-700 text-sm mt-3 font-medium animate-pulse">Model Llama-3.3-70b sedang merangka laporan...</p>
                </div>
            </div>
        </div>

        <div id="resultArea" class="hidden bg-white rounded-3xl shadow-xl p-8 space-y-4 border-2 border-blue-100">
            <div class="flex justify-between items-center">
                <h3 class="font-semibold text-gray-700 uppercase tracking-wider">Hasil Laporan (Auto-Save Berjaya)</h3>
                <span class="text-[10px] bg-green-100 text-green-700 px-3 py-1 rounded-full font-bold">DISIMPAN KE GOOGLE SHEET</span>
            </div>
            <textarea id="output" rows="18" class="w-full p-6 border rounded-2xl bg-gray-50 text-sm leading-relaxed outline-none shadow-inner"></textarea>
            <button onclick="downloadPDF()" class="w-full bg-red-600 text-white py-4 rounded-xl shadow-md font-medium hover:bg-red-700 transition-all uppercase tracking-widest">Cetak PDF (Format A4)</button>
        </div>

        <div class="bg-white rounded-3xl shadow-xl p-8">
            <h3 class="text-lg font-semibold text-gray-700 mb-6 flex items-center gap-2">
                <span>📜</span> SEJARAH LAPORAN TERKINI
            </h3>
            <div id="historyList" class="grid grid-cols-1 gap-4">
                <p class="text-gray-400 text-sm animate-pulse">Menghubungkan ke Google Sheet...</p>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            API_KEY: "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",
            GAS_URL: "https://script.google.com/macros/s/AKfycbw0V8xQ9YeP559gvjjkngTdDW7GULGby9PG4jk5_8uTJgfii2GPYW2gMl2mb1BAIJ90/exec",
            MODEL: "llama-3.3-70b-versatile" 
        };

        let images = [];

        function handleImages(input) {
            const files = Array.from(input.files);
            if (images.length + files.length > 10) return alert("Maksimum 10 gambar.");
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    images.push({ src: e.target.result, name: file.name });
                    renderPreviews();
                };
                reader.readAsDataURL(file);
            });
        }

        function renderPreviews() {
            const container = document.getElementById('previewArea');
            container.innerHTML = images.map((img, i) => `
                <div class="relative flex-shrink-0">
                    <img src="${img.src}" class="w-24 h-24 object-cover rounded-xl border-2 border-white shadow-sm">
                    <button class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 text-xs flex items-center justify-center" onclick="images.splice(${i},1);renderPreviews()">×</button>
                </div>
            `).join('');
        }

        async function generateAndSave() {
            const type = document.getElementById('reportType').value;
            const note = document.getElementById('notes').value;
            const teacherName = document.getElementById('teacher').value;
            
            if(!note || !teacherName || images.length === 0) return alert("Sila lengkapkan maklumat dan masukkan sekurang-kurangnya 1 gambar.");
            
            document.getElementById('btnAction').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            const systemPrompt = `Tulis sebuah laporan esei formal yang sangat lengkap dalam Bahasa Melayu Malaysia yang tepat. 
            Panjang laporan mestilah di antara 300 hingga 350 patah perkataan. 
            Tulis dalam bentuk perenggan (Pendahuluan, Objektif, Butiran Program, Kekuatan/Kelemahan, dan Kesimpulan). 
            JANGAN gunakan sebarang simbol bold (asterisk **). 
            Format khusus untuk: ${type}. 
            Data: Program: ${document.getElementById('subject').value}, Guru: ${teacherName}, Bil Murid: ${document.getElementById('studentCount').value}, Tarikh: ${document.getElementById('reportDate').value}, Nota: ${note}`;

            try {
                const resp = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${CONFIG.API_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        model: CONFIG.MODEL, 
                        messages: [{ role: "user", content: systemPrompt }],
                        temperature: 0.7
                    })
                });
                const data = await resp.json();
                const successReport = data.choices[0].message.content;

                document.getElementById('output').value = successReport;
                document.getElementById('resultArea').classList.remove('hidden');
                
                document.getElementById('status').innerText = "Menghantar data ke Google Sheet...";
                await autoSaveToGS(successReport);
                fetchHistory(); // Segarkan senarai sejarah bawah

            } catch (e) {
                alert("Ralat AI. Sila semak sambungan internet anda.");
            }

            document.getElementById('btnAction').classList.remove('hidden');
            document.getElementById('loading').classList.add('hidden');
        }

        async function autoSaveToGS(reportText) {
            const payload = {
                action: "MASUK",
                passcode: "101010",
                nama: document.getElementById('teacher').value,
                type: document.getElementById('reportType').value,
                tujuan: document.getElementById('subject').value,
                report: reportText,
                images: images.map(img => ({ data: img.src.split(',')[1], name: img.name }))
            };
            try {
                await fetch(CONFIG.GAS_URL, { method: "POST", body: JSON.stringify(payload) });
            } catch (e) { console.error("Auto-save gagal."); }
        }

        async function fetchHistory() {
            try {
                const resp = await fetch(CONFIG.GAS_URL, { method: "POST", body: JSON.stringify({ action: "HISTORY", passcode: "101010" }) });
                const data = await resp.json();
                document.getElementById('historyList').innerHTML = data.reverse().map(rec => `
                    <div class="p-5 border-l-4 border-blue-600 bg-white shadow-sm rounded-r-xl border border-gray-100">
                        <div class="flex justify-between text-[10px] text-gray-400 font-bold"><span>${rec.date}</span><span class="text-blue-500">${rec.type}</span></div>
                        <div class="font-semibold text-gray-800 text-md mt-1">${rec.tujuan}</div>
                        <div class="text-[10px] text-gray-500 mt-1 italic">Pelapor: ${rec.nama}</div>
                        <div class="flex gap-2 mt-4 overflow-x-auto pb-1">
                            ${rec.imgCols.filter(link => link !== "").map((link, idx) => `<a href="${link}" target="_blank" class="text-[9px] bg-blue-50 text-blue-700 px-3 py-1.5 rounded-lg border border-blue-100 hover:bg-blue-100 transition-all">Gmbr ${idx+1}</a>`).join('')}
                            <button onclick="restore('${rec.report.replace(/'/g, "\\'")}')" class="text-[9px] bg-gray-800 text-white px-3 py-1.5 rounded-lg ml-auto">LIHAT TEKS</button>
                        </div>
                    </div>
                `).join('');
            } catch (e) { document.getElementById('historyList').innerHTML = "Gagal memuat sejarah."; }
        }

        function restore(txt) {
            document.getElementById('output').value = txt;
            document.getElementById('resultArea').classList.remove('hidden');
            document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth' });
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            
            // Muka Surat 1: Teks
            doc.setFontSize(16);
            doc.text(document.getElementById('reportType').value, 105, 20, null, null, "center");
            doc.setFontSize(10);
            const lines = doc.splitTextToSize(document.getElementById('output').value, 160);
            doc.text(lines, 25, 40);

            // Muka Surat 2: Gambar (Susunan Maksimum A4)
            if(images.length > 0) {
                doc.addPage();
                doc.setFontSize(14);
                doc.text("LAMPIRAN GAMBAR AKTIVITI", 105, 15, null, null, "center");
                let x = 15, y = 25;
                images.forEach((img, i) => {
                    if (i > 0 && i % 2 === 0) { x = 15; y += 52; }
                    doc.addImage(img.src, 'JPEG', x, y, 85, 48);
                    x += 95;
                });
            }
            doc.save(`Laporan_${Date.now()}.pdf`);
        }
    </script>
</body>
</html>
