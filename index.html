<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Inklusif Pro - Auto Switch AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .loader { border: 3px solid #e2e8f0; border-top: 3px solid #4f46e5; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .image-preview { position: relative; display: inline-block; }
        .remove-img { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid white; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-indigo-700 p-6 text-white">
            <h1 class="text-2xl font-bold">Laporan Inklusif Pro 🤖</h1>
            <p class="text-indigo-100 text-xs mt-1">Sistem Penjanaan Laporan Automatik (Versi Multi-Model)</p>
        </div>

        <div class="p-6 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="subject" class="p-3 border rounded-xl bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Mata Pelajaran">
                <input type="text" id="teacher" class="p-3 border rounded-xl bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Nama Guru">
                <input type="text" id="studentCount" class="p-3 border rounded-xl bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Bil. Murid Inklusif">
                <input type="date" id="reportDate" class="p-3 border rounded-xl bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase tracking-wider">Gambar Aktiviti (Max 4)</label>
                <input type="file" id="imageInput" accept="image/*" multiple class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100" onchange="handleImageUpload(this)">
                <div id="imagePreviewContainer" class="flex gap-2 mt-3 overflow-x-auto p-2 border border-dashed rounded-xl min-h-[80px]">
                    <span id="placeholderText" class="text-gray-400 m-auto text-xs italic">Sila pilih gambar...</span>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase tracking-wider">Nota Ringkas Aktiviti</label>
                <textarea id="activityNotes" rows="4" class="w-full p-3 border rounded-xl bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Contoh: Murid belajar teknik baling bola, suasana ceria, semua murid terlibat aktif."></textarea>
            </div>

            <button onclick="generateAIReport()" id="btnGenerate" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-95 flex justify-center items-center gap-2">
                <span>✨ Jana Laporan & PDF</span>
            </button>

            <div id="loadingState" class="hidden text-center py-2">
                <div class="flex items-center justify-center gap-3 mb-1">
                    <div class="loader"></div>
                    <span class="text-indigo-600 font-bold text-sm">Sedang Menulis Laporan...</span>
                </div>
                <div id="switchStatus" class="text-[10px] text-orange-500 font-mono italic animate-pulse"></div>
            </div>
        </div>

        <div id="resultSection" class="hidden border-t bg-gray-50 p-6">
            <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">Pratinjau Laporan AI:</label>
            <textarea id="finalOutput" rows="8" class="w-full p-4 border rounded-xl text-sm leading-relaxed shadow-inner mb-4"></textarea>
            <div class="flex gap-3">
                <button onclick="saveAsPDF()" class="flex-1 bg-red-600 text-white font-bold py-3 rounded-xl hover:bg-red-700">📄 Download PDF</button>
                <button onclick="saveToCloud()" id="btnCloud" class="flex-1 bg-green-600 text-white font-bold py-3 rounded-xl hover:bg-green-700">☁️ Simpan Cloud</button>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            API_KEY: "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",
            // Senarai model: Jika satu gagal, dia akan cuba yang bawah secara automatik
            MODELS: [
                "llama-3.3-70b-versatile", 
                "mixtral-8x7b-32768",
                "llama-3.1-8b-instant"
            ],
            GAS_URL: "https://script.google.com/macros/s/AKfycbz3qlb57bEdTU-WONmJc8qIkdxdYLcueS3kWj0WQHTFEKNgFhVC7K6ki9akhy2O8cUZ/exec"
        };

        let uploadedImages = [];

        window.onload = () => { document.getElementById('reportDate').valueAsDate = new Date(); };

        function handleImageUpload(input) {
            const files = Array.from(input.files);
            if (uploadedImages.length + files.length > 4) return alert("Maksimum 4 gambar sahaja.");
            
            const placeholder = document.getElementById('placeholderText');
            if (placeholder) placeholder.remove();

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    uploadedImages.push(e.target.result);
                    const div = document.createElement('div');
                    div.className = "image-preview";
                    div.innerHTML = `<img src="${e.target.result}" class="h-20 w-20 object-cover rounded-lg border shadow-sm"><span class="remove-img" onclick="removeImage(this, '${e.target.result}')">×</span>`;
                    document.getElementById('imagePreviewContainer').appendChild(div);
                };
                reader.readAsDataURL(file);
            });
            input.value = "";
        }

        function removeImage(btn, src) {
            uploadedImages = uploadedImages.filter(img => img !== src);
            btn.parentElement.remove();
        }

        async function generateAIReport() {
            const notes = document.getElementById('activityNotes').value;
            if (!notes) return alert("Sila isi nota aktiviti!");
            if (uploadedImages.length === 0) return alert("Sila masukkan sekurang-kurangnya 1 gambar!");

            const btn = document.getElementById('btnGenerate');
            const loader = document.getElementById('loadingState');
            const switchLabel = document.getElementById('switchStatus');

            btn.classList.add('hidden');
            loader.classList.remove('hidden');

            const prompt = `Jana laporan rasmi Program Inklusif dalam Bahasa Melayu. 
            Mata Pelajaran: ${document.getElementById('subject').value}, Guru: ${document.getElementById('teacher').value}, 
            Murid: ${document.getElementById('studentCount').value}, Tarikh: ${document.getElementById('reportDate').value}.
            Nota: ${notes}.
            Hasilkan laporan lengkap dengan: Tajuk, Ringkasan, Pemerhatian, Impak dan Penutup.`;

            let success = false;

            // LOGIK UTAMA AUTO-SWITCH
            for (let i = 0; i < CONFIG.MODELS.length; i++) {
                const currentModel = CONFIG.MODELS[i];
                switchLabel.innerText = `Sedang mencuba: ${currentModel}...`;

                try {
                    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                        method: "POST",
                        headers: { "Authorization": `Bearer ${CONFIG.API_KEY}`, "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: currentModel,
                            messages: [{ role: "user", content: prompt }],
                            temperature: 0.7
                        })
                    });

                    const data = await response.json();

                    if (response.ok && data.choices && data.choices[0]) {
                        document.getElementById('finalOutput').value = data.choices[0].message.content;
                        document.getElementById('resultSection').classList.remove('hidden');
                        success = true;
                        await saveAsPDF(); 
                        break; // Keluar dari loop jika berjaya
                    } else {
                        // Jika respon tidak OK, kita log ke console dan biar loop terus ke model seterusnya
                        console.error(`Model ${currentModel} gagal:`, data.error ? data.error.message : "Ralat");
                    }
                } catch (error) {
                    console.error(`Gagal menyambung ke ${currentModel}:`, error);
                }
            }

            if (!success) {
                alert("Kesemua model AI sedang sibuk atau tamat tempoh. Sila cuba sebentar lagi.");
            }

            btn.classList.remove('hidden');
            loader.classList.add('hidden');
        }

        async function saveAsPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const text = document.getElementById('finalOutput').value;
            const teacher = document.getElementById('teacher').value;
            const date = document.getElementById('reportDate').value;

            doc.setFontSize(16); doc.text("LAPORAN PROGRAM INKLUSIF", 105, 20, null, null, "center");
            doc.setFontSize(10); doc.text(`Tarikh: ${date} | Oleh: ${teacher}`, 105, 28, null, null, "center");
            doc.line(20, 32, 190, 32);

            const splitText = doc.splitTextToSize(text, 170);
            doc.setFontSize(11); doc.text(splitText, 20, 42);

            if (uploadedImages.length > 0) {
                doc.addPage();
                doc.text("LAMPIRAN GAMBAR:", 20, 20);
                let y = 30;
                uploadedImages.forEach(img => {
                    if (y > 220) { doc.addPage(); y = 20; }
                    doc.addImage(img, 'JPEG', 25, y, 160, 90); y += 100;
                });
            }
            doc.save(`Laporan_${date}.pdf`);
        }

        async function saveToCloud() {
            const btn = document.getElementById('btnCloud');
            btn.innerText = "Menyimpan..."; btn.disabled = true;
            const payload = {
                subject: document.getElementById('subject').value,
                teacher: document.getElementById('teacher').value,
                studentCount: document.getElementById('studentCount').value,
                reportDate: document.getElementById('reportDate').value,
                notes: document.getElementById('activityNotes').value,
                fullReport: document.getElementById('finalOutput').value,
                images: uploadedImages
            };
            try {
                const response = await fetch(CONFIG.GAS_URL, { method: "POST", body: JSON.stringify(payload) });
                const res = await response.json();
                alert(res.status === "success" ? "✅ Berjaya disimpan!" : "❌ Gagal.");
            } catch (e) { alert("❌ Ralat Cloud."); }
            btn.innerText = "☁️ Simpan Cloud"; btn.disabled = false;
        }
    </script>
</body>
</html>
