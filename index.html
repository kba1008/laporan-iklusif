<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Inklusif Pro - Anti-Ralat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .loader { border: 3px solid #e2e8f0; border-top: 3px solid #4f46e5; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .image-preview { position: relative; display: inline-block; }
        .remove-img { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid white; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-indigo-700 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">Laporan Inklusif Pro 🤖</h1>
            <p class="text-indigo-100 text-xs mt-1">Sistem Penjanaan Laporan Automatik (Stable Version)</p>
        </div>

        <div class="p-6 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="subject" class="p-3 border rounded-xl bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Mata Pelajaran">
                <input type="text" id="teacher" class="p-3 border rounded-xl bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Nama Guru">
                <input type="text" id="studentCount" class="p-3 border rounded-xl bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Bil. Murid">
                <input type="date" id="reportDate" class="p-3 border rounded-xl bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">Gambar (Max 4)</label>
                <div class="flex gap-3 mb-2">
                    <label class="flex-1 cursor-pointer bg-indigo-50 hover:bg-indigo-100 p-4 rounded-xl border border-indigo-200 text-center transition-all">
                        <div class="text-2xl mb-1">📸</div>
                        <div class="text-xs font-bold text-indigo-700">Kamera</div>
                        <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handleImageUpload(this)">
                    </label>
                    <label class="flex-1 cursor-pointer bg-indigo-50 hover:bg-indigo-100 p-4 rounded-xl border border-indigo-200 text-center transition-all">
                        <div class="text-2xl mb-1">🖼️</div>
                        <div class="text-xs font-bold text-indigo-700">Upload</div>
                        <input type="file" accept="image/*" multiple class="hidden" onchange="handleImageUpload(this)">
                    </label>
                </div>
                <div id="imagePreviewContainer" class="flex gap-2 mt-3 overflow-x-auto p-2 border border-dashed rounded-xl min-h-[80px]"></div>
            </div>

            <textarea id="activityNotes" rows="4" class="w-full p-3 border rounded-xl bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Ceritakan aktiviti anda di sini..."></textarea>

            <button onclick="generateAIReport()" id="btnGenerate" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg flex justify-center items-center gap-2 transition-all">
                <span>✨ Jana Laporan</span>
            </button>

            <div id="loadingState" class="hidden text-center py-2">
                <div class="flex items-center justify-center gap-3 mb-1">
                    <div class="loader"></div>
                    <span class="text-indigo-600 font-bold text-sm">AI Sedang Menulis...</span>
                </div>
                <div id="switchStatus" class="text-[10px] text-orange-500 font-mono italic">Mencari model terbaik...</div>
            </div>
        </div>

        <div id="resultSection" class="hidden border-t bg-gray-50 p-6">
            <textarea id="finalOutput" rows="8" class="w-full p-4 border rounded-xl text-sm leading-relaxed mb-4"></textarea>
            <div class="flex gap-3">
                <button onclick="saveAsPDF()" class="flex-1 bg-red-600 text-white font-bold py-3 rounded-xl">📄 PDF</button>
                <button onclick="saveToCloud()" id="btnCloud" class="flex-1 bg-green-600 text-white font-bold py-3 rounded-xl">☁️ Cloud</button>
            </div>
        </div>

        <!-- NEW: HISTORY SECTION -->
        <div class="border-t p-6 bg-white">
            <button onclick="loadHistory()" id="btnHistory" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl flex justify-center items-center gap-2 transition-all">
                <span>🗂️ Lihat Sejarah Laporan</span>
            </button>
            <div id="historyContainer" class="mt-4 hidden space-y-3 max-h-60 overflow-y-auto pr-1">
                <!-- History items will be injected here -->
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            API_KEY: "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",
            // SENARAI MODEL YANG SAH (Model Decommissioned telah dibuang)
            MODELS: [
                "llama-3.3-70b-versatile", 
                "llama-3.1-70b-specdec",
                "mixtral-8x7b-32768",
                "llama-3.1-8b-instant"
            ],
            // URL Google App Script daripada appskrip.txt yang di-deploy
            GAS_URL: "https://script.google.com/macros/s/AKfycbz3qlb57bEdTU-WONmJc8qIkdxdYLcueS3kWj0WQHTFEKNgFhVC7K6ki9akhy2O8cUZ/exec"
        };

        let uploadedImages = [];
        window.onload = () => { document.getElementById('reportDate').valueAsDate = new Date(); };

        function handleImageUpload(input) {
            const files = Array.from(input.files);
            if (uploadedImages.length + files.length > 4) return alert("Maksimum 4 gambar.");
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    uploadedImages.push(e.target.result);
                    const div = document.createElement('div');
                    div.className = "image-preview";
                    div.innerHTML = `<img src="${e.target.result}" class="h-20 w-20 object-cover rounded-lg border shadow-sm"><span class="remove-img" onclick="removeImage(this, '${e.target.result}')">×</span>`;
                    document.getElementById('imagePreviewContainer').appendChild(div);
                };
                reader.readAsDataURL(file);
            });
            input.value = "";
        }

        function removeImage(btn, src) {
            uploadedImages = uploadedImages.filter(img => img !== src);
            btn.parentElement.remove();
        }

        async function generateAIReport() {
            const notes = document.getElementById('activityNotes').value;
            if (!notes) return alert("Sila isi nota!");
            if (uploadedImages.length === 0) return alert("Sila masukkan gambar!");

            const btn = document.getElementById('btnGenerate');
            const loader = document.getElementById('loadingState');
            const switchLabel = document.getElementById('switchStatus');

            btn.classList.add('hidden');
            loader.classList.remove('hidden');

            const prompt = `Hasilkan laporan rasmi Program Pendidikan Inklusif yang formal dalam Bahasa Melayu.\n            Mata Pelajaran: ${document.getElementById('subject').value}\n            Nama Guru: ${document.getElementById('teacher').value}\n            Bilangan Murid: ${document.getElementById('studentCount').value}\n            Tarikh: ${document.getElementById('reportDate').value}\n            Butiran Aktiviti: ${notes}`;

            let success = false;

            // LOGIK AUTO-SWITCH YANG DIPERBAIKI
            for (const model of CONFIG.MODELS) {
                switchLabel.innerText = `Menghubungi: ${model}...`;
                console.log(`Cuba model: ${model}`);

                try {
                    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                        method: "POST",
                        headers: { "Authorization": `Bearer ${CONFIG.API_KEY}`, "Content-Type": "application/json" },
                        body: JSON.stringify({ model: model, messages: [{ role: "user", content: prompt }], temperature: 0.7 })
                    });

                    const data = await response.json();

                    // HANYA TERUSKAN JIKA BERJAYA (STATUS 200)
                    if (response.ok && data.choices && data.choices[0]) {
                        document.getElementById('finalOutput').value = data.choices[0].message.content;
                        document.getElementById('resultSection').classList.remove('hidden');
                        success = true;
                        break; 
                    } else {
                        // Jika model tamat tempoh/ralat, biarkan loop terus ke model seterusnya tanpa alert
                        console.warn(`Model ${model} gagal: ${data.error ? data.error.message : "Ralat"}`);
                    }
                } catch (error) {
                    console.error(`Gagal akses ${model}:`, error);
                }
            }

            if (!success) {
                alert("Ralat: Kesemua model AI sedang sibuk. Sila cuba lagi sebentar atau periksa API Key anda.");
            }

            btn.classList.remove('hidden');
            loader.classList.add('hidden');
        }

        // FUNGSI PDF & CLOUD (RUJUKAN APPSKRIP.TXT)
        async function saveAsPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const text = document.getElementById('finalOutput').value;
            const splitText = doc.splitTextToSize(text, 170);
            doc.setFontSize(14); doc.text("LAPORAN INKLUSIF", 105, 20, null, null, "center");
            doc.setFontSize(10); doc.text(splitText, 20, 40);
            if (uploadedImages.length > 0) {
                doc.addPage();
                let y = 20;
                uploadedImages.forEach(img => {
                    if (y > 220) { doc.addPage(); y = 20; }
                    doc.addImage(img, 'JPEG', 25, y, 160, 90); y += 100;
                });
            }
            doc.save(`Laporan_${Date.now()}.pdf`);
        }

        async function saveToCloud() {
            const btn = document.getElementById('btnCloud');
            btn.innerText = "Menyimpan..."; btn.disabled = true;
            const payload = {
                action: "MASUK", // Berdasarkan doPost dalam appskrip.txt [cite: 5]
                passcode: "101010", // Passcode rahsia anda [cite: 2]
                nama: document.getElementById('teacher').value,
                kategori: "PELAWAT", // Menggunakan kategori Pelawat untuk simpanan umum [cite: 21]
                tujuan: "LAPORAN AI: " + document.getElementById('subject').value,
                fullReport: document.getElementById('finalOutput').value
            };
            try {
                const response = await fetch(CONFIG.GAS_URL, { method: "POST", body: JSON.stringify(payload) });
                alert("Berjaya disimpan!");
            } catch (e) { alert("Ralat simpan."); }
            btn.innerText = "☁️ Simpan Cloud"; btn.disabled = false;
        }

        // NEW: FUNGSI TARIK DATA SEJARAH
        async function loadHistory() {
            const btn = document.getElementById('btnHistory');
            const container = document.getElementById('historyContainer');
            btn.innerText = "Sedang Mengambil Data..."; btn.disabled = true;
            container.innerHTML = ""; 
            container.classList.add("hidden");

            const payload = {
                action: "HISTORY", // Keyword untuk trigger bacaan di GAS
                passcode: "101010"
            };

            try {
                // Menggunakan POST seperti saveToCloud untuk elak isu CORS
                const response = await fetch(CONFIG.GAS_URL, { 
                    method: "POST", 
                    body: JSON.stringify(payload) 
                });
                const data = await response.json();
                
                // Andaikan data adalah array atau { records: [] }
                const records = Array.isArray(data) ? data : (data.records || []);
                
                if (records.length === 0) {
                    alert("Tiada rekod dijumpai.");
                } else {
                    container.classList.remove("hidden");
                    records.forEach(rec => {
                        // Structure item sejarah
                        const el = document.createElement("div");
                        el.className = "p-3 bg-gray-50 border rounded-lg cursor-pointer hover:bg-indigo-50 hover:border-indigo-300 transition-all";
                        // Fallback keys sekiranya nama column berbeza
                        const dateDisplay = rec.date || rec.tarikh || "-No Date-";
                        const subjDisplay = rec.tujuan || rec.subject || "-No Subject-";
                        const content = rec.fullReport || rec.laporan || "";

                        el.innerHTML = `
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-xs font-bold text-gray-600">${dateDisplay}</span>
                                <span class="text-[10px] bg-white border px-2 rounded text-indigo-600">CLOUD</span>
                            </div>
                            <div class="font-semibold text-sm text-gray-800">${subjDisplay}</div>
                        `;
                        el.onclick = () => {
                            document.getElementById('finalOutput').value = content;
                            document.getElementById('resultSection').classList.remove('hidden');
                            document.getElementById('finalOutput').scrollIntoView({behavior: 'smooth'});
                        };
                        container.appendChild(el);
                    });
                }
            } catch (e) {
                console.error(e);
                alert("Gagal mengambil sejarah. Pastikan App Script menyokong action: 'HISTORY'.");
            }
            btn.innerText = "🗂️ Lihat Sejarah Laporan"; btn.disabled = false;
        }
    </script>
</body>
</html>
