<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Inklusif Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #4f46e5; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .image-preview { position: relative; display: inline-block; }
        .remove-img { position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; text-align: center; cursor: pointer; }
    </style>
</head>
<body class="p-4 min-h-screen flex justify-center items-start">

    <div class="w-full max-w-2xl bg-white rounded-xl shadow-lg overflow-hidden">
        
        <div class="bg-indigo-700 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">Laporan Inklusif Pro 🤖</h1>
            <p class="text-indigo-200 text-sm">Automasi Laporan Pendidikan Khas (PWA)</p>
        </div>

        <div class="p-6 space-y-5">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Mata Pelajaran</label>
                    <input type="text" id="subject" class="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-indigo-500" placeholder="Pendidikan Jasmani">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Nama Guru</label>
                    <input type="text" id="teacher" class="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-indigo-500" placeholder="Cikgu Zamberi">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Bilangan Murid Inklusif</label>
                    <input type="text" id="studentCount" class="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-indigo-500" placeholder="6 Orang">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Tarikh Laporan</label>
                    <input type="date" id="reportDate" class="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Bukti Gambar (Max 4)</label>
                <input type="file" id="imageInput" accept="image/*" multiple class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100" onchange="handleImageUpload(this)">
                <div id="imagePreviewContainer" class="flex gap-2 mt-2 overflow-x-auto min-h-[100px] p-2 border border-dashed border-gray-300 rounded-lg">
                    <span id="placeholderText" class="text-xs text-gray-400 m-auto">Tiada gambar dipilih</span>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Nota Aktiviti (Input untuk AI)</label>
                <textarea id="activityNotes" rows="4" class="w-full p-3 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-indigo-500" placeholder="Murid melakukan regangan, aktiviti berjalan lancar, interaksi sangat baik..."></textarea>
            </div>

            <button onclick="generateAIReport()" id="btnGenerate" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg shadow transition flex justify-center items-center gap-2">
                <span>✨ Jana & Terus Download PDF</span>
            </button>

            <div id="loadingState" class="hidden flex justify-center items-center gap-2 py-2">
                <div class="loader"></div>
                <span class="text-indigo-600 font-semibold">AI sedang menulis laporan...</span>
            </div>
        </div>

        <div id="resultSection" class="hidden border-t border-gray-200 bg-gray-50 p-6">
            <h3 class="font-bold text-gray-800 mb-2">Hasil Laporan AI:</h3>
            <textarea id="finalOutput" rows="10" class="w-full p-4 border border-gray-300 rounded-lg text-sm shadow-inner leading-relaxed"></textarea>
            
            <div class="mt-4 flex flex-col md:flex-row gap-3">
                <button onclick="saveAsPDF()" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg flex justify-center items-center gap-2">
                    📄 Download Semula PDF
                </button>
                <button onclick="saveToCloud()" id="btnCloud" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg flex justify-center items-center gap-2">
                    ☁️ Simpan ke Cloud
                </button>
            </div>
        </div>

    </div>

    <script>
        // --- CONFIGURATION ---
        const CONFIG = {
            API_KEY_groq: "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", 
            MODEL_ID: "llama-3.1-70b-versatile",
            GAS_URL: "https://script.google.com/macros/s/AKfycbz3qlb57bEdTU-WONmJc8qIkdxdYLcueS3kWj0WQHTFEKNgFhVC7K6ki9akhy2O8cUZ/exec"
        };

        let uploadedImages = [];

        window.onload = () => {
            document.getElementById('reportDate').valueAsDate = new Date();
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(err => console.log("SW Fail:", err));
            }
        };

        // 1. PENGENDALIAN GAMBAR
        function handleImageUpload(input) {
            const files = input.files;
            const container = document.getElementById('imagePreviewContainer');
            const placeholder = document.getElementById('placeholderText');

            if (uploadedImages.length + files.length > 4) {
                alert("Maksimum 4 gambar sahaja.");
                return;
            }

            if (placeholder) placeholder.remove();

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    uploadedImages.push(e.target.result);
                    const div = document.createElement('div');
                    div.className = "image-preview";
                    div.innerHTML = `<img src="${e.target.result}" class="h-20 w-20 object-cover rounded border"><span class="remove-img" onclick="removeImage(this, '${e.target.result}')">×</span>`;
                    container.appendChild(div);
                };
                reader.readAsDataURL(file);
            });
            input.value = "";
        }

        function removeImage(btn, src) {
            uploadedImages = uploadedImages.filter(img => img !== src);
            btn.parentElement.remove();
            if (uploadedImages.length === 0) {
                document.getElementById('imagePreviewContainer').innerHTML = '<span id="placeholderText" class="text-xs text-gray-400 m-auto">Tiada gambar dipilih</span>';
            }
        }

        // 2. JANA LAPORAN DENGAN GROQ AI
        async function generateAIReport() {
            const notes = document.getElementById('activityNotes').value;
            if (!notes) return alert("Sila masukkan nota aktiviti.");
            if (uploadedImages.length === 0) return alert("Sila muat naik sekurang-kurangnya 1 gambar.");

            const btn = document.getElementById('btnGenerate');
            const loader = document.getElementById('loadingState');

            btn.classList.add('hidden');
            loader.classList.remove('hidden');

            const prompt = `Anda adalah seorang Penolong Kanan Pendidikan Khas yang profesional.
            Sila jana laporan rasmi Program Inklusif dalam Bahasa Melayu yang lengkap dan formal.
            Butiran:
            Mata Pelajaran: ${document.getElementById('subject').value}
            Guru: ${document.getElementById('teacher').value}
            Murid: ${document.getElementById('studentCount').value}
            Tarikh: ${document.getElementById('reportDate').value}
            Nota: ${notes}

            Format Laporan:
            1. Tajuk Laporan
            2. Ringkasan Aktiviti (Huraikan secara naratif yang menarik)
            3. Pemerhatian & Tahap Penglibatan Murid
            4. Pencapaian & Impak
            5. Kesimpulan & Penutup

            Pastikan panjang laporan sekitar 200-250 patah perkataan.`;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${CONFIG.API_KEY_groq}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: CONFIG.MODEL_ID,
                        messages: [{ role: "user", content: prompt }],
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                
                const output = data.choices[0].message.content;
                document.getElementById('finalOutput').value = output;
                document.getElementById('resultSection').classList.remove('hidden');
                
                await saveAsPDF();

            } catch (error) {
                console.error(error);
                alert("Ralat AI: " + error.message);
            } finally {
                btn.classList.remove('hidden');
                loader.classList.add('hidden');
            }
        }

        // 3. SIMPAN SEBAGAI PDF
        async function saveAsPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const text = document.getElementById('finalOutput').value;
            const teacher = document.getElementById('teacher').value;
            const date = document.getElementById('reportDate').value;

            doc.setFont("helvetica", "bold");
            doc.setFontSize(16);
            doc.text("LAPORAN PROGRAM PENDIDIKAN INKLUSIF", 105, 20, null, null, "center");
            
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.text(`Tarikh: ${date}  |  Disediakan oleh: ${teacher.toUpperCase()}`, 105, 28, null, null, "center");
            doc.line(20, 32, 190, 32);

            doc.setFontSize(11);
            const splitText = doc.splitTextToSize(text, 170);
            let yPos = 42;

            splitText.forEach(line => {
                if (yPos > 280) { doc.addPage(); yPos = 20; }
                doc.text(line, 20, yPos);
                yPos += 6;
            });

            if (uploadedImages.length > 0) {
                doc.addPage();
                doc.setFont("helvetica", "bold");
                doc.text("LAMPIRAN BERGAMBAR:", 20, 20);
                
                let imgY = 30;
                uploadedImages.forEach((img, index) => {
                    if (imgY > 220) { doc.addPage(); imgY = 20; }
                    doc.addImage(img, 'JPEG', 25, imgY, 160, 90);
                    imgY += 100;
                });
            }

            doc.save(`Laporan_Inklusif_${date}.pdf`);
        }

        // 4. SIMPAN KE GOOGLE SHEETS (CLOUD)
        async function saveToCloud() {
            const btn = document.getElementById('btnCloud');
            btn.innerText = "Menyimpan...";
            btn.disabled = true;

            const payload = {
                subject: document.getElementById('subject').value,
                teacher: document.getElementById('teacher').value,
                studentCount: document.getElementById('studentCount').value,
                reportDate: document.getElementById('reportDate').value,
                notes: document.getElementById('activityNotes').value,
                fullReport: document.getElementById('finalOutput').value,
                images: uploadedImages
            };

            try {
                const response = await fetch(CONFIG.GAS_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                const resData = await response.json();
                if(resData.status === "success") alert("✅ Berjaya disimpan ke Google Sheet!");
                else alert("❌ Gagal: " + resData.message);
            } catch (error) {
                alert("❌ Ralat Cloud: Sila pastikan Google Apps Script anda telah di-deploy dengan betul.");
            } finally {
                btn.innerText = "☁️ Simpan ke Cloud";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
